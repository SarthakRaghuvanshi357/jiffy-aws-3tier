<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jiffy: groceries in 10 minutes</title>
<style>
:root{--violet:#4B2AAD;--lime:#D4F34A;--lav:#F1EDFB;--ink:#1A1433;--line:#DDD6F0}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#fff;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--violet);color:#fff;display:flex;gap:14px;align-items:center;padding:12px 5vw;flex-wrap:wrap}
.logo{font-size:1.7rem;font-weight:900;color:var(--lime);letter-spacing:-.5px}
.eta{font-size:.85rem;line-height:1.2}.eta b{display:block;font-size:1rem}
#q{flex:1;min-width:180px;font:inherit;padding:10px 14px;border:0;border-radius:12px}
button{font:inherit;font-weight:800;cursor:pointer;border:2px solid var(--violet);background:#fff;color:var(--violet);border-radius:10px;padding:5px 14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.cats{display:flex;gap:10px;overflow-x:auto;padding:16px 5vw;background:var(--lav)}
.cats button{white-space:nowrap;border-radius:999px;border-color:var(--line)}.cats button.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.banner{margin:18px 5vw 0;padding:20px;border-radius:18px;background:var(--lime);font-weight:800;font-size:1.15rem}
main{padding:10px 5vw}h2{margin:22px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:#fff}
.pic{height:120px;display:grid;place-items:center;font-size:3.8rem;position:relative}.pic img{width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:8px;left:8px;background:var(--violet);color:#fff;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:8px}
.body{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}.body h3{margin:0;font-size:.95rem;line-height:1.25}.unit{font-size:.82rem;opacity:.7}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}s{opacity:.55;font-size:.85rem}
.step{display:flex;align-items:center;gap:8px;background:var(--violet);color:#fff;border-radius:10px;padding:2px 6px}.step button{border:0;background:none;color:#fff;padding:2px 8px;font-size:1.1rem}
.bar{position:fixed;left:3vw;right:3vw;bottom:12px;background:var(--violet);color:#fff;border-radius:16px;padding:12px 18px;display:none;justify-content:space-between;align-items:center}
.bar.show{display:flex}.bar button{background:var(--lime);border-color:var(--lime);color:var(--ink)}
dialog{border:0;border-radius:18px;max-width:440px;width:92vw;padding:20px}dialog::backdrop{background:rgba(26,20,51,.55)}
input.f{width:100%;font:inherit;padding:9px;margin:4px 0 10px;border:2px solid var(--line);border-radius:10px}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0}.tot{border-top:2px solid var(--ink);font-weight:800}
.msg{padding:14px;border:2px dashed var(--violet);border-radius:12px}
</style></head><body>
<header><span class="logo">jiffy</span><span class="eta"><b>Delivery in 10 minutes</b>to your door</span><input id="q" placeholder="Search chips, oil, milk…" aria-label="Search products"></header>
<nav class="cats" id="cats" aria-label="Categories"></nav>
<div class="banner">Free delivery on orders above ₹199</div>
<main id="list"><p>Loading…</p></main>
<div class="bar" id="bar"><span id="barTxt"></span><button id="open">View cart</button></div>
<dialog id="dlg"><h2 style="margin-top:0">Your cart</h2><div id="items"></div><div id="bill"></div>
<label>Name<input class="f" id="cn" autocomplete="name"></label><label>Phone<input class="f" id="cp" inputmode="tel" autocomplete="tel"></label>
<label>Delivery address<input class="f" id="ca" autocomplete="street-address"></label><p id="status" role="status"></p>
<button id="place" style="background:var(--violet);color:#fff">Place order</button> <button id="close">Keep shopping</button></dialog>
<script>
const $=s=>document.querySelector(s),inr=n=>'₹'+n.toLocaleString('en-IN'),cart={};let prods=[],cat='All';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/products');if(!r.ok)throw 0;prods=await r.json();draw()}
catch(e){$('#list').innerHTML='<p class="msg">Could not reach the server. Check that the app tier is running, then reload.</p>'}}
const ctl=p=>cart[p.id]?`<span class="step"><button data-a="-" data-id="${p.id}" aria-label="Remove one">−</button>${cart[p.id]}<button data-a="+" data-id="${p.id}" aria-label="Add one">+</button></span>`:`<button data-a="+" data-id="${p.id}">ADD</button>`;
const card=p=>`<article class="card"><div class="pic" style="background:${p.tint}">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:p.emoji}${p.mrp>p.price?`<span class="off">${Math.round(100-p.price*100/p.mrp)}% OFF</span>`:''}</div><div class="body"><span class="unit">${esc(p.unit)}</span><h3>${esc(p.name)}</h3><div class="foot"><span><b>${inr(p.price)}</b> ${p.mrp>p.price?`<s>${inr(p.mrp)}</s>`:''}</span>${ctl(p)}</div></div></article>`;
function draw(){const q=$('#q').value.trim().toLowerCase(),cats=['All',...new Set(prods.map(p=>p.category))];
 $('#cats').innerHTML=cats.map(c=>`<button data-c="${esc(c)}" class="${c==cat?'on':''}">${esc(c)}</button>`).join('');
 const shown=prods.filter(p=>(cat=='All'||p.category==cat)&&p.name.toLowerCase().includes(q));
 const groups=[...new Set(shown.map(p=>p.category))];
 $('#list').innerHTML=groups.length?groups.map(g=>`<h2>${esc(g)}</h2><div class="grid">${shown.filter(p=>p.category==g).map(card).join('')}</div>`).join(''):'<p class="msg">Nothing matches your search. Try another word or category.</p>';
 const n=Object.values(cart).reduce((a,b)=>a+b,0);$('#bar').classList.toggle('show',n>0);$('#barTxt').textContent=`${n} item${n>1?'s':''} · ${inr(sub())}`}
const sub=()=>Object.entries(cart).reduce((a,[id,q])=>a+prods.find(p=>p.id==id).price*q,0);
function bill(){const s=sub(),f=s>=199?0:25;
 $('#items').innerHTML=Object.keys(cart).length?Object.entries(cart).map(([id,q])=>{const p=prods.find(x=>x.id==id);return`<div class="row"><span>${p.emoji} ${esc(p.name)} × ${q}</span><span>${inr(p.price*q)}</span></div>`}).join(''):'<p>Your cart is empty. Add something from the shelves.</p>';
 $('#bill').innerHTML=`<div class="row"><span>Items</span><span>${inr(s)}</span></div><div class="row"><span>Delivery</span><span>${f?inr(f):'Free'}</span></div><div class="row tot"><span>To pay</span><span>${inr(s+f)}</span></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.c){cat=b.dataset.c;draw()}
 if(b.dataset.a){const id=b.dataset.id;cart[id]=(cart[id]||0)+(b.dataset.a=='+'?1:-1);if(cart[id]<=0)delete cart[id];draw();if($('#dlg').open)bill()}});
$('#q').oninput=draw;$('#open').onclick=()=>{bill();$('#status').textContent='';$('#dlg').showModal()};$('#close').onclick=()=>$('#dlg').close();
$('#place').onclick=async()=>{const st=$('#status');st.textContent='Placing order…';
 try{const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:$('#cn').value,phone:$('#cp').value,address:$('#ca').value,items:Object.entries(cart).map(([id,qty])=>({id:+id,qty}))})});const d=await r.json();
 if(!r.ok)throw new Error(d.error);for(const k in cart)delete cart[k];draw();bill();st.textContent=`Order #${d.orderId} placed. Arriving in about ${d.etaMinutes} minutes. Total ${inr(d.total)}.`}
 catch(e){st.textContent=e.message||'Order failed. Please try again.'}};
load();
</script></body></html>
