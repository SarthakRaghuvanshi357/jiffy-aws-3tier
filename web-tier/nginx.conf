server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri /index.html; }
  location /api/ {
    proxy_pass http://INTERNAL-ALB-DNS-NAME;   # replace with your internal load balancer DNS
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /health { proxy_pass http://INTERNAL-ALB-DNS-NAME/health; }
}
